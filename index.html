<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Personal Health Profile</title>
  <meta name="description" content="Keep your health information in one place and bring it to appointments.">
  <meta name="theme-color" content="#12305a">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Health Profile">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Home screen -->
  <div id="homeView" class="view">
    <header class="topbar">
      <div class="topbar-inner home-bar">
        <button type="button" class="btn ghost" id="instrBtn">Instructions</button>
        <button type="button" class="btn ghost settings-open">Settings</button>
      </div>
    </header>
    <main class="home">
      <h1 class="home-title">Personal Health Profile</h1>
      <p class="home-sub" id="homeSub"></p>
      <button type="button" class="btn primary big" id="homePrimary"></button>
      <div class="home-secondary" id="homeSecondary"></div>
      <div id="notices"></div>
      <p class="privacy">Saved only on this device.</p>
    </main>
  </div>

  <!-- Form -->
  <div id="formView" class="view" hidden>
    <header class="topbar">
      <div class="topbar-inner">
        <button type="button" class="btn ghost" id="homeBtn">Home</button>
        <div class="brand">
          <h1>Personal Health Profile</h1>
        </div>
        <div class="actions">
          <span class="save-status" id="saveStatus" aria-live="polite"></span>
          <button type="button" class="btn ghost settings-open">Settings</button>
          <button type="button" class="btn primary pdf-open">Download PDF</button>
        </div>
      </div>
    </header>

    <div class="layout">
      <nav class="sidenav" aria-label="Sections">
        <ul id="nav"></ul>
      </nav>

      <main id="main">
        <div id="sections"></div>

        <section class="add-section card" id="addSection">
          <h2>Add a section</h2>
          <div class="add-grid" id="addGrid"></div>
        </section>

        <p class="privacy">Saved only on this device. Nothing is sent anywhere. Keep a backup file in a safe place.</p>
      </main>
    </div>
  </div>

  <!-- Download PDF -->
  <dialog id="pdfDialog" class="panel" aria-labelledby="pdfTitle">
    <form method="dialog" class="dialog-body">
      <h2 id="pdfTitle">Download PDF</h2>
      <p class="sub">Choose what to include.</p>
      <div class="pdf-choices" id="pdfChoices"></div>
      <p class="sub" id="pdfEmpty" hidden>Nothing entered yet.</p>
      <div class="dialog-actions">
        <button type="button" class="btn ghost" id="pdfSelectAll">Select all</button>
        <span class="spacer"></span>
        <button value="cancel" class="btn ghost">Cancel</button>
        <button type="button" class="btn primary" id="pdfGo">Download</button>
      </div>
    </form>
  </dialog>

  <!-- Settings -->
  <dialog id="settingsDialog" class="panel" aria-labelledby="settingsTitle">
    <form method="dialog" class="dialog-body">
      <div class="panel-head">
        <h2 id="settingsTitle">Settings</h2>
        <button value="close" class="btn ghost">Close</button>
      </div>
      <div class="settings-list">
        <button type="button" class="setting" id="exportBtn">
          <b>Save a backup</b>
          <span id="lastBackup">Download a copy of your information.</span>
        </button>
        <button type="button" class="setting" id="importBtn">
          <b>Restore from backup</b>
          <span>Replace what is here with a saved backup file.</span>
        </button>
        <button type="button" class="setting" id="tourBtn">
          <b>Replay the tutorial</b>
          <span>See the welcome steps again.</span>
        </button>
        <button type="button" class="setting" id="sampleBtn">
          <b>Load sample data</b>
          <span>Fill in a made-up profile to try the app.</span>
        </button>
        <button type="button" class="setting danger" id="eraseBtn">
          <b>Erase everything</b>
          <span>Delete all information saved on this device.</span>
        </button>
      </div>
    </form>
  </dialog>

  <!-- Instructions -->
  <dialog id="instrDialog" class="panel" aria-labelledby="instrTitle">
    <form method="dialog" class="dialog-body">
      <div class="panel-head">
        <h2 id="instrTitle">Instructions</h2>
        <button value="close" class="btn ghost">Close</button>
      </div>
      <ol class="steps" id="instrSteps"></ol>
    </form>
  </dialog>

  <!-- Tutorial and confirmation pop-ups -->
  <dialog id="tourDialog" class="popup" aria-labelledby="tourTitle">
    <div class="dialog-body">
      <p class="step-count" id="tourCount"></p>
      <h2 id="tourTitle"></h2>
      <p id="tourText"></p>
      <div class="dialog-actions">
        <span class="spacer"></span>
        <button type="button" class="btn primary" id="tourNext">Next</button>
      </div>
    </div>
  </dialog>

  <dialog id="confirmDialog" class="popup" aria-labelledby="confirmTitle">
    <form method="dialog" class="dialog-body">
      <h2 id="confirmTitle"></h2>
      <p id="confirmText"></p>
      <div class="dialog-actions">
        <span class="spacer"></span>
        <button value="cancel" class="btn ghost">Cancel</button>
        <button value="ok" class="btn primary" id="confirmOk"></button>
      </div>
    </form>
  </dialog>

  <input type="file" id="importFile" accept="application/json,.json" hidden>

  <script src="vendor/jspdf.umd.min.js"></script>
  <script src="vendor/jspdf.plugin.autotable.min.js"></script>
  <script src="schema.js"></script>
  <script src="pdf.js"></script>
  <script src="sample.js"></script>
  <script src="app.js"></script>
</body>
</html>
